<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה לאימון — אורית רז</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;background:#FAF5F5;min-height:100vh;direction:rtl}
.topbar{background:#C4A0A0;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;font-weight:800}
.topbar a{color:#fff;font-size:13px;text-decoration:none;opacity:.8}
.week-bar{background:#fff;text-align:center;padding:10px;font-size:13px;color:#888;border-bottom:1px solid #EDD8D5}
.join-bar{background:#fff3e0;border-bottom:1px solid #ffe0b2;padding:12px 20px;text-align:center;font-size:13px;color:#e65100}
.join-bar a{color:#C4A0A0;font-weight:700;text-decoration:none;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:16px;max-width:960px;margin:0 auto}
.day-col{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #EDD8D5;box-shadow:0 2px 8px rgba(184,133,90,.06)}
.day-head{background:#C4A0A0;color:#fff;padding:10px 14px;font-size:14px;font-weight:700;text-align:center}
.slot{padding:13px 14px;border-bottom:1px solid #FAF5F5;cursor:pointer;transition:background .15s}
.slot:last-child{border-bottom:none}
.slot:hover:not(.full){background:#FAF5F5}
.slot.full{cursor:default}
.slot-time{font-size:17px;font-weight:800;color:#C4A0A0;margin-bottom:3px}
.slot-type{font-size:12px;color:#999;margin-bottom:8px}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.badge-ok{background:#f0fdf4;color:#166534}
.badge-few{background:#fffbeb;color:#92400e}
.badge-full{background:#fef2f2;color:#991b1b}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:380px}
.modal-icon{font-size:32px;margin-bottom:12px;text-align:center}
.modal h2{font-size:19px;font-weight:800;color:#C4A0A0;text-align:center;margin-bottom:4px}
.modal-sub{text-align:center;font-size:13px;color:#999;margin-bottom:20px}
.finp{width:100%;border:1.5px solid #EDD8D5;border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;direction:rtl;margin-bottom:12px;color:#222}
.finp:focus{border-color:#C4A0A0}
.fbtn{width:100%;background:#C4A0A0;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
.fbtn:hover{background:#A88484}
.fbtn:disabled{opacity:.6;cursor:not-allowed}
.cancel{width:100%;background:none;border:none;color:#bbb;font-size:13px;cursor:pointer;margin-top:10px;padding:6px;font-family:inherit}
.fmsg{text-align:center;font-size:13px;margin-top:10px;min-height:18px}
.succ-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.succ-overlay.on{display:flex}
.succ-box{background:#fff;border-radius:18px;padding:36px 28px;text-align:center;max-width:320px;width:100%}
.succ-icon{font-size:52px;margin-bottom:16px}
.succ-title{font-size:20px;font-weight:800;color:#C4A0A0;margin-bottom:8px}
.succ-msg{font-size:14px;color:#666;line-height:1.6;margin-bottom:20px}
.succ-close{background:#C4A0A0;color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:8px}}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <h1>🏋️ הרשמה לאימון</h1>
  <a href="index.html">← חזרה לאתר</a>
</div>
<div class="week-bar" id="weekBar">טוען...</div>
<div class="join-bar">
  מתאמנת חדשה? <a href="join.html">הצטרפי לסטודיו ←</a>
  &nbsp;·&nbsp; <a onclick="openCancelLookup()" style="cursor:pointer">ביטול הרשמה</a>
</div>
<div class="grid" id="grid">
  <div style="grid-column:1/-1;text-align:center;padding:48px;color:#ccc;font-size:14px">טוען לוח שעות...</div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon">🩷</div>
    <h2 id="modal-title"></h2>
    <p class="modal-sub" id="modal-sub"></p>
    <input class="finp" id="b-name" placeholder="שם מלא *" autocomplete="name"/>
    <input class="finp" id="b-phone" placeholder="טלפון *" type="tel" autocomplete="tel" inputmode="numeric"/>
    <button class="fbtn" id="book-btn" onclick="confirmBook()">אני רוצה להירשם 🩷</button>
    <button class="cancel" onclick="closeModal()">ביטול</button>
    <div class="fmsg" id="book-msg"></div>
  </div>
</div>
<!-- מודל ביטול הרשמה -->
<div class="overlay" id="cancelOverlay">
  <div class="modal">
    <div class="modal-icon">🗓️</div>
    <h2>ביטול הרשמה</h2>
    <p class="modal-sub">הכניסי טלפון לחיפוש האימונים שלך</p>
    <div id="cancelLookup">
      <input class="finp" id="c-phone" placeholder="טלפון *" type="tel" inputmode="numeric"/>
      <button class="fbtn" onclick="lookupCancels()">חפשי את האימונים שלי</button>
    </div>
    <div id="cancelList" style="display:none;margin-top:12px"></div>
    <div class="fmsg" id="cancel-msg"></div>
    <button class="cancel" onclick="closeCancelOverlay()">סגור</button>
  </div>
</div>

<div class="succ-overlay" id="succOverlay">
  <div class="succ-box">
    <div class="succ-icon">✅</div>
    <div class="succ-title" id="succ-title">נרשמת בהצלחה!</div>
    <p class="succ-msg" id="succ-msg"></p>
    <button class="succ-close" onclick="document.getElementById('succOverlay').classList.remove('on')">סגור</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyD3H-2M1cYEupObbeeRtlcMPHyQtzEjP1Q",authDomain:"orit-raz.firebaseapp.com",projectId:"orit-raz",storageBucket:"orit-raz.firebasestorage.app",messagingSenderId:"1093566537569",appId:"1:1093566537569:web:1123fc5926a543d9e1ef20"});
var db=firebase.firestore();
var SCHEDULE=[
  {day:'ראשון',slots:[{id:'sun-18',time:'18:00',type:'פונקציונלי',cap:7},{id:'sun-19',time:'19:00',type:'פונקציונלי',cap:7},{id:'sun-20',time:'20:00',type:'פונקציונלי',cap:7}]},
  {day:'שני',slots:[{id:'mon-18',time:'18:00',type:'פונקציונלי',cap:7},{id:'mon-19',time:'19:00',type:'פונקציונלי',cap:7}]},
  {day:'שלישי',slots:[{id:'tue-18',time:'18:30',type:'פילאטיס',cap:7}]},
  {day:'רביעי',slots:[{id:'wed-18',time:'18:00',type:'פונקציונלי',cap:7},{id:'wed-19',time:'19:00',type:'פונקציונלי',cap:7},{id:'wed-20',time:'20:00',type:'פונקציונלי',cap:7}]},
  {day:'חמישי',slots:[{id:'thu-18',time:'18:00',type:'פונקציונלי',cap:7},{id:'thu-19',time:'19:00',type:'פונקציונלי',cap:7}]},
  {day:'שישי',slots:[{id:'fri-08',time:'08:15',type:'נפח',cap:9}]}
];
var counts={},waits={},currentSlot=null;
function getWeekKey(){var d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d.toISOString().split('T')[0];}
var weekKey=getWeekKey();
function weekLabel(){var sun=new Date();sun.setDate(sun.getDate()-sun.getDay());sun.setHours(0,0,0,0);var sat=new Date(sun);sat.setDate(sun.getDate()+6);var f=function(d){return d.toLocaleDateString('he-IL',{day:'numeric',month:'long'});};return 'שבוע '+f(sun)+' – '+f(sat);}
document.getElementById('weekBar').textContent=weekLabel();
function findSlot(id){for(var d of SCHEDULE)for(var s of d.slots)if(s.id===id)return s;return null;}
function badgeHtml(count,cap,waitCount){
  var left=cap-count;
  var pct=Math.round((count/cap)*100);
  var barColor=left<=0?'#c62828':left<=2?'#e65100':'#2e7d32';
  var bar='<div style="margin-top:6px;background:#eee;border-radius:4px;height:5px;overflow:hidden">'
    +'<div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+barColor+';border-radius:4px;transition:.3s"></div></div>';
  var label='<div style="font-size:11px;color:#999;margin-top:3px">'+count+' תפוס · '+left+' פנוי</div>';
  if(left<=0){
    var wt=waitCount?'<div style="font-size:10px;color:#C4A0A0;margin-top:2px">'+waitCount+' ממתינות</div>':'';
    return '<span class="badge badge-full">מלא</span>'+wt+bar;
  }
  var badge=left<=2?'<span class="badge badge-few">נותרו '+left+'</span>':'<span class="badge badge-ok">'+left+' מקומות</span>';
  return badge+label+bar;
}
function renderGrid(){var html='';SCHEDULE.forEach(function(day){html+='<div class="day-col"><div class="day-head">'+day.day+'</div>';day.slots.forEach(function(s){var c=counts[s.id]||0,w=waits[s.id]||0,full=c>=s.cap;var click=full?' onclick="openWaitlist(\''+s.id+'\')"':' onclick="openModal(\''+s.id+'\')"';html+='<div class="slot'+( full?' full':'')+'"'+click+'>';html+='<div class="slot-time">'+s.time+'</div>';html+='<div class="slot-type">'+s.type+'</div>';html+=badgeHtml(c,s.cap,w);if(full)html+='<div style="font-size:10px;color:#C4A0A0;margin-top:4px">לרשימת המתנה ←</div>';html+='</div>';});html+='</div>';});document.getElementById('grid').innerHTML=html;}
function loadBookings(){var ids=[];SCHEDULE.forEach(function(d){d.slots.forEach(function(s){ids.push(s.id);});});var ps=ids.map(function(id){return db.collection('bookings').doc(weekKey+'_'+id).get().then(function(doc){counts[id]=doc.exists?Object.keys(doc.data().registrations||{}).length:0;waits[id]=doc.exists?Object.keys(doc.data().waitlist||{}).length:0;});});Promise.all(ps).then(renderGrid);}
/* רשימת המתנה */
function openWaitlist(slotId){
  var s=findSlot(slotId);if(!s)return;
  currentSlot=s;
  document.getElementById('modal-title').textContent=s.type+' · '+s.time+' — מלא';
  document.getElementById('modal-sub').textContent='הצטרפי לרשימת המתנה — אם יתפנה מקום תועברי אוטומטית';
  document.getElementById('b-name').value='';document.getElementById('b-phone').value='';
  document.getElementById('book-msg').textContent='';
  document.getElementById('book-btn').textContent='הצטרפי לרשימת המתנה ⏳';
  document.getElementById('book-btn').disabled=false;
  document.getElementById('book-btn').onclick=confirmWaitlist;
  document.getElementById('overlay').classList.add('on');
}
function confirmWaitlist(){
  var name=document.getElementById('b-name').value.trim();
  var phone=document.getElementById('b-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var msg=document.getElementById('book-msg');
  msg.style.color='#e24b4a';
  if(!name){msg.textContent='נא להכניס שם';return;}
  if(!phone||phone.length<9){msg.textContent='מספר טלפון לא תקין';return;}
  var s=currentSlot;
  document.getElementById('book-btn').disabled=true;
  msg.style.color='#888';msg.textContent='מעבד...';
  var ref=db.collection('bookings').doc(weekKey+'_'+s.id);
  db.runTransaction(function(t){return t.get(ref).then(function(doc){
    var regs=doc.exists?(doc.data().registrations||{}):{};
    var wl=doc.exists?(doc.data().waitlist||{}):{};
    if(regs[phone]){throw new Error('already');}
    if(wl[phone]){throw new Error('inwait');}
    wl[phone]={name:name,phone:phone,at:new Date().toISOString(),pos:Object.keys(wl).length+1};
    t.set(ref,{waitlist:wl},{merge:true});
  });}).then(function(){
    waits[s.id]=(waits[s.id]||0)+1;
    closeModal();renderGrid();
    document.getElementById('succ-title').textContent='נרשמת לרשימת המתנה ⏳';
    document.getElementById('succ-msg').textContent=name+', נוספת לרשימת המתנה לאימון בשעה '+s.time+'.\nאם יתפנה מקום — תועברי אוטומטית!';
    document.getElementById('succOverlay').classList.add('on');
  }).catch(function(e){
    document.getElementById('book-btn').disabled=false;
    msg.style.color='#e24b4a';
    if(e.message==='already')msg.textContent='את כבר רשומה לאימון זה';
    else if(e.message==='inwait')msg.textContent='את כבר ברשימת המתנה';
    else msg.textContent='שגיאה, נסי שוב';
  });
}
function openModal(slotId){var s=findSlot(slotId);if(!s)return;currentSlot=s;document.getElementById('modal-title').textContent=s.type+' · '+s.time;document.getElementById('modal-sub').textContent='מלאי פרטים ונרשמך לאימון';document.getElementById('b-name').value='';document.getElementById('b-phone').value='';document.getElementById('book-msg').textContent='';document.getElementById('book-btn').disabled=false;document.getElementById('overlay').classList.add('on');document.getElementById('b-name').focus();}
function closeModal(){document.getElementById('overlay').classList.remove('on');document.getElementById('book-btn').textContent='אני רוצה להירשם 🩷';document.getElementById('book-btn').onclick=confirmBook;}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
function confirmBook(){var name=document.getElementById('b-name').value.trim();var phone=document.getElementById('b-phone').value.trim().replace(/[\s\-\(\)]/g,'');var msg=document.getElementById('book-msg');msg.style.color='#e24b4a';if(!name){msg.textContent='נא להכניס שם';return;}if(!phone||phone.length<9){msg.textContent='מספר טלפון לא תקין';return;}var s=currentSlot;document.getElementById('book-btn').disabled=true;msg.style.color='#888';msg.textContent='מעבד...';var ref=db.collection('bookings').doc(weekKey+'_'+s.id);db.runTransaction(function(t){return t.get(ref).then(function(doc){var regs=doc.exists?(doc.data().registrations||{}):{};if(Object.keys(regs).length>=s.cap)throw new Error('full');if(regs[phone])throw new Error('dup');regs[phone]={name:name,phone:phone,at:new Date().toISOString()};t.set(ref,{registrations:regs,slotId:s.id,weekKey:weekKey,type:s.type,time:s.time},{merge:true});});}).then(function(){counts[s.id]=(counts[s.id]||0)+1;closeModal();renderGrid();document.getElementById('succ-title').textContent='נרשמת! 🩷';document.getElementById('succ-msg').textContent=name+', נרשמת לאימון '+s.type+' בשעה '+s.time+'.\nנתראה בסטודיו!';document.getElementById('succOverlay').classList.add('on');}).catch(function(e){document.getElementById('book-btn').disabled=false;msg.style.color='#e24b4a';if(e.message==='full')msg.textContent='😔 האימון הזה מלא';else if(e.message==='dup')msg.textContent='מספר זה כבר רשום לאימון';else msg.textContent='שגיאה, נסי שוב';});}
/* ביטול הרשמה */
var DAY_OFFSET={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5};
function slotDatetime(slotId,timeStr){
  var prefix=slotId.split('-')[0];
  var offset=DAY_OFFSET[prefix]||0;
  var parts=timeStr.split(':');
  var sun=new Date(weekKey+'T00:00:00');
  sun.setDate(sun.getDate()+offset);
  sun.setHours(parseInt(parts[0]),parseInt(parts[1]),0,0);
  return sun;
}
function canCancel(slotId,timeStr){
  var dt=slotDatetime(slotId,timeStr);
  return (dt.getTime()-Date.now())>2*60*60*1000;
}
function openCancelLookup(){
  document.getElementById('c-phone').value='';
  document.getElementById('cancelList').style.display='none';
  document.getElementById('cancel-msg').textContent='';
  document.getElementById('cancelLookup').style.display='block';
  document.getElementById('cancelOverlay').classList.add('on');
}
function closeCancelOverlay(){document.getElementById('cancelOverlay').classList.remove('on');}
document.getElementById('cancelOverlay').addEventListener('click',function(e){if(e.target===this)closeCancelOverlay();});
function lookupCancels(){
  var phone=document.getElementById('c-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var msg=document.getElementById('cancel-msg');
  if(!phone||phone.length<9){msg.style.color='#e24b4a';msg.textContent='מספר לא תקין';return;}
  msg.style.color='#888';msg.textContent='מחפש...';
  var allSlots=[];
  SCHEDULE.forEach(function(d){d.slots.forEach(function(s){allSlots.push(s);});});
  var ps=allSlots.map(function(s){return db.collection('bookings').doc(weekKey+'_'+s.id).get().then(function(doc){return{slot:s,doc:doc};});});
  Promise.all(ps).then(function(results){
    msg.textContent='';
    var mine=results.filter(function(r){return r.doc.exists&&(r.doc.data().registrations||{})[phone];});
    if(mine.length===0){msg.style.color='#e24b4a';msg.textContent='לא נמצאו הרשמות לטלפון זה השבוע';return;}
    document.getElementById('cancelLookup').style.display='none';
    var html='<div style="font-size:13px;font-weight:700;color:#888;margin-bottom:10px">האימונים שלך השבוע:</div>';
    mine.forEach(function(r){
      var s=r.slot;
      var ok=canCancel(s.id,s.time);
      var dt=slotDatetime(s.id,s.time);
      var dayStr=dt.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'});
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #FAF5F5">'
        +'<div><div style="font-weight:700;font-size:14px">'+s.type+' · '+s.time+'</div>'
        +'<div style="font-size:12px;color:#999">'+dayStr+'</div></div>';
      if(ok){
        html+='<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">'
          +'<button onclick="doCancel(\''+s.id+'\',\''+s.time+'\',\''+phone+'\')" style="background:#fce4ec;color:#c62828;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">ביטול</button>'
          +'<button onclick="openMove(\''+s.id+'\',\''+s.time+'\',\''+phone+'\')" style="background:#e8f5e9;color:#2e7d32;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">הזזה ←</button>'
          +'</div>';
      } else {
        html+='<span style="font-size:12px;color:#e24b4a;font-weight:700">מאוחר מדי<br><span style="font-weight:400">פחות משעתיים</span></span>';
      }
      html+='</div>';
    });
    document.getElementById('cancelList').innerHTML=html;
    document.getElementById('cancelList').style.display='block';
    document.getElementById('cancelList')._phone=phone;
  }).catch(function(){msg.style.color='#e24b4a';msg.textContent='שגיאה, נסי שוב';});
}
function slotDayPrefix(slotId){return slotId.split('-')[0];}
function openMove(fromSlotId,fromTime,phone){
  var dayPrefix=slotDayPrefix(fromSlotId);
  // מצא שעות אחרות באותו יום
  var sameDay=[];
  SCHEDULE.forEach(function(d){d.slots.forEach(function(s){
    if(slotDayPrefix(s.id)===dayPrefix && s.id!==fromSlotId){
      var left=s.cap-(counts[s.id]||0);
      if(left>0 && canCancel(s.id,s.time)) sameDay.push(s);
    }
  });});
  var list=document.getElementById('cancelList');
  if(sameDay.length===0){
    document.getElementById('cancel-msg').style.color='#e24b4a';
    document.getElementById('cancel-msg').textContent='אין שעות פנויות אחרות באותו יום';
    return;
  }
  document.getElementById('cancel-msg').textContent='';
  var html='<div style="font-size:13px;font-weight:700;color:#888;margin-bottom:8px">בחרי שעה חדשה:</div>';
  sameDay.forEach(function(s){
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #FAF5F5">'
      +'<div><div style="font-weight:700;font-size:14px">'+s.type+' · '+s.time+'</div>'
      +'<div style="font-size:12px;color:#aaa">נותרו '+(s.cap-(counts[s.id]||0))+' מקומות</div></div>'
      +'<button onclick="doMove(\''+fromSlotId+'\',\''+s.id+'\',\''+s.time+'\',\''+phone+'\')" '
      +'style="background:#C4A0A0;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer">הזזה ←</button>'
      +'</div>';
  });
  html+='<button onclick="lookupCancels()" style="background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;margin-top:10px;padding:4px">← חזרה</button>';
  list.innerHTML=html;
}
function doMove(fromId,toId,toTime,phone){
  if(!canCancel(fromId,SCHEDULE.flatMap(function(d){return d.slots;}).find(function(s){return s.id===fromId;}).time)){
    document.getElementById('cancel-msg').textContent='מאוחר מדי לשינוי';return;
  }
  var name=(counts[fromId]||'');
  var fromRef=db.collection('bookings').doc(weekKey+'_'+fromId);
  var toRef=db.collection('bookings').doc(weekKey+'_'+toId);
  var toSlot=SCHEDULE.flatMap(function(d){return d.slots;}).find(function(s){return s.id===toId;});
  db.runTransaction(function(t){
    return Promise.all([t.get(fromRef),t.get(toRef)]).then(function(docs){
      var fromRegs=docs[0].exists?(docs[0].data().registrations||{}):{};
      var toRegs=docs[1].exists?(docs[1].data().registrations||{}):{};
      var reg=fromRegs[phone];
      if(!reg)throw new Error('notfound');
      if(Object.keys(toRegs).length>=toSlot.cap)throw new Error('full');
      delete fromRegs[phone];
      toRegs[phone]=reg;
      t.set(fromRef,{registrations:fromRegs},{merge:true});
      t.set(toRef,{registrations:toRegs,slotId:toId,weekKey:weekKey,type:toSlot.type,time:toSlot.time},{merge:true});
    });
  }).then(function(){
    counts[fromId]=Math.max(0,(counts[fromId]||1)-1);
    counts[toId]=(counts[toId]||0)+1;
    renderGrid();
    closeCancelOverlay();
    document.getElementById('succ-title').textContent='ההרשמה הוזזה! 🩷';
    document.getElementById('succ-msg').textContent='הועברת לאימון בשעה '+toTime+'. נתראה בסטודיו!';
    document.getElementById('succOverlay').classList.add('on');
  }).catch(function(e){
    document.getElementById('cancel-msg').style.color='#e24b4a';
    document.getElementById('cancel-msg').textContent=e.message==='full'?'האימון הזה מלא':'שגיאה, נסי שוב';
  });
}
function doCancel(slotId,timeStr,phone){
  if(!canCancel(slotId,timeStr)){document.getElementById('cancel-msg').textContent='לא ניתן לבטל פחות משעתיים לפני האימון';return;}
  var ref=db.collection('bookings').doc(weekKey+'_'+slotId);
  var promoted=null;
  db.runTransaction(function(t){return t.get(ref).then(function(doc){
    var regs=doc.exists?(doc.data().registrations||{}):{};
    var wl=doc.exists?(doc.data().waitlist||{}):{};
    delete regs[phone];
    // קידום ראשונה ברשימת המתנה
    var waitKeys=Object.keys(wl).sort(function(a,b){return(wl[a].at||'')>(wl[b].at||'')?1:-1;});
    if(waitKeys.length>0){
      var nextPhone=waitKeys[0];
      promoted=wl[nextPhone];
      regs[nextPhone]=promoted;
      delete wl[nextPhone];
    }
    t.set(ref,{registrations:regs,waitlist:wl},{merge:true});
  });}).then(function(){
    counts[slotId]=Math.max(0,(counts[slotId]||1)-(promoted?0:1));
    waits[slotId]=Math.max(0,(waits[slotId]||1)-(promoted?1:0));
    renderGrid();closeCancelOverlay();
    document.getElementById('succ-title').textContent='ההרשמה בוטלה';
    document.getElementById('succ-msg').textContent='ההרשמה לאימון בשעה '+timeStr+' בוטלה.'+(promoted?'\n\n'+promoted.name+' הועברה אוטומטית מרשימת ההמתנה!':'');
    document.getElementById('succOverlay').classList.add('on');
  }).catch(function(){document.getElementById('cancel-msg').textContent='שגיאה, נסי שוב';});
}
loadBookings();
</script>

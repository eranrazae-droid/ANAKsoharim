<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הרשמה לאימון — אורית רז</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;background:#FFF0F6;min-height:100vh;direction:rtl}
.topbar{background:#D63878;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:18px;font-weight:800}
.topbar a{color:#fff;font-size:13px;text-decoration:none;opacity:.8}
.week-bar{background:#fff;text-align:center;padding:10px;font-size:13px;color:#888;border-bottom:1px solid #F9C0D8}
.join-bar{background:#fff3e0;border-bottom:1px solid #ffe0b2;padding:12px 20px;text-align:center;font-size:13px;color:#e65100}
.join-bar a{color:#D63878;font-weight:700;text-decoration:none;margin-right:8px}
.filter-bar{background:#fff;padding:10px 16px;border-bottom:1px solid #F9C0D8;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-chip{background:#FFF0F6;border:1.5px solid #F9C0D8;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;color:#888;font-family:inherit;transition:.2s;white-space:nowrap}
.filter-chip.active{background:#D63878;border-color:#D63878;color:#fff}
.my-phone-wrap{display:flex;gap:4px;flex:1;min-width:200px}
.my-phone-inp{flex:1;border:1.5px solid #F9C0D8;border-radius:20px;padding:6px 14px;font-size:13px;outline:none;font-family:inherit;direction:rtl;min-width:0}
.my-phone-inp:focus{border-color:#D63878}
.my-phone-btn{background:#D63878;color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:16px;max-width:1200px;margin:0 auto}
.week-label{grid-column:1/-1;font-size:13px;font-weight:700;color:#D63878;padding:10px 4px 2px;border-top:1px solid #F9C0D8}
.week-label:first-child{border-top:none;padding-top:2px}
.day-col{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #F9C0D8;box-shadow:0 2px 8px rgba(184,133,90,.06)}
.day-head{background:#D63878;color:#fff;padding:10px 14px;font-size:14px;font-weight:700;text-align:center}
.slot{padding:13px 14px 13px 36px;border-bottom:1px solid #FFF0F6;cursor:pointer;transition:background .15s;position:relative}
.slot:last-child{border-bottom:none}
.slot:hover:not(.full):not(.locked){background:#FFF0F6}
.slot.full{cursor:default}
.slot.fav{background:linear-gradient(135deg,#fff 80%,#fde8e8 100%)}
.slot.locked{opacity:.55;cursor:not-allowed;background:#fafafa}
.slot.my-booking{border-right:3px solid #2e7d32}
.slot-time{font-size:17px;font-weight:800;color:#D63878;margin-bottom:3px}
.slot-type{font-size:12px;color:#999;margin-bottom:2px}
.slot-instructor{font-size:11px;color:#D63878;font-weight:600;margin-bottom:8px}
.my-badge{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:6px;font-size:11px;font-weight:700;padding:2px 8px;margin-bottom:6px}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.badge-ok{background:#f0fdf4;color:#166534}
.badge-few{background:#fffbeb;color:#92400e}
.badge-full{background:#fef2f2;color:#991b1b}
.fav-btn{position:absolute;top:8px;left:10px;background:none;border:none;cursor:pointer;padding:2px;line-height:1;transition:transform .15s;z-index:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.fav-btn:active{transform:scale(1.4)}
.fav-btn svg{width:22px;height:22px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:380px}
.modal-icon{font-size:32px;margin-bottom:12px;text-align:center}
.modal h2{font-size:19px;font-weight:800;color:#D63878;text-align:center;margin-bottom:4px}
.modal-sub{text-align:center;font-size:13px;color:#999;margin-bottom:20px}
.finp{width:100%;border:1.5px solid #F9C0D8;border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;direction:rtl;margin-bottom:12px;color:#222}
.finp:focus{border-color:#D63878}
.fbtn{width:100%;background:#D63878;color:#fff;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
.fbtn:hover{background:#B02060}
.fbtn:disabled{opacity:.6;cursor:not-allowed}
.cancel{width:100%;background:none;border:none;color:#bbb;font-size:13px;cursor:pointer;margin-top:10px;padding:6px;font-family:inherit}
.fmsg{text-align:center;font-size:13px;margin-top:10px;min-height:18px}
.succ-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.succ-overlay.on{display:flex}
.succ-box{background:#fff;border-radius:18px;padding:36px 28px;text-align:center;max-width:320px;width:100%}
.succ-icon{font-size:52px;margin-bottom:16px}
.succ-title{font-size:20px;font-weight:800;color:#D63878;margin-bottom:8px}
.succ-msg{font-size:14px;color:#666;line-height:1.6;margin-bottom:20px;white-space:pre-line}
.succ-close{background:#D63878;color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
@media(max-width:600px){.grid{grid-template-columns:1fr;gap:8px;padding:10px}}
</style>
</head>
<body>
<div class="topbar">
  <h1>🏋️ הרשמה לאימון</h1>
  <a href="index.html">← חזרה לאתר</a>
</div>
<div class="week-bar" id="weekBar">טוען...</div>
<div class="join-bar">
  מתאמנת חדשה? <a href="join.html">הצטרפי לסטודיו ←</a>
  &nbsp;·&nbsp; <a onclick="openCancelLookup()" style="cursor:pointer">ביטול הרשמה</a>
</div>
<div class="filter-bar">
  <button class="filter-chip" id="filterAvail" onclick="toggleFilterAvail()">🟢 פנויים בלבד</button>
  <button class="filter-chip" id="filterFavs" onclick="toggleFilterFavs()"><svg viewBox="0 0 24 24" fill="#e53935" style="width:14px;height:14px;vertical-align:middle;margin-left:4px"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> מועדפים</button>
  <div class="my-phone-wrap">
    <input id="my-phone" class="my-phone-inp" type="tel" inputmode="numeric" placeholder="טלפון — הצגי האימונים שלי"/>
    <button class="my-phone-btn" onclick="lookupMyBookings()">הצגי</button>
    <button class="my-phone-btn" id="logoutBtn" style="display:none;background:#aaa" onclick="clearMyBookings()">✕ יציאה</button>
  </div>
</div>
<div class="grid" id="grid">
  <div style="grid-column:1/-1;text-align:center;padding:48px;color:#ccc;font-size:14px">טוען לוח שעות...</div>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-icon">🩷</div>
    <h2 id="modal-title"></h2>
    <p class="modal-sub" id="modal-sub"></p>
    <div id="logged-as" style="display:none;background:#f0fdf4;border-radius:10px;padding:10px 14px;font-size:14px;color:#2e7d32;font-weight:700;margin-bottom:12px;text-align:center"></div>
    <input class="finp" id="b-name" placeholder="שם מלא *" autocomplete="name"/>
    <input class="finp" id="b-phone" placeholder="טלפון *" type="tel" autocomplete="tel" inputmode="numeric"/>
    <button class="fbtn" id="book-btn" onclick="confirmBook()">אני רוצה להירשם 🩷</button>
    <button class="cancel" onclick="closeModal()">ביטול</button>
    <div class="fmsg" id="book-msg"></div>
  </div>
</div>
<div class="overlay" id="cancelOverlay">
  <div class="modal">
    <div class="modal-icon">🗓️</div>
    <h2>ביטול הרשמה</h2>
    <p class="modal-sub">הכניסי טלפון לחיפוש האימונים שלך</p>
    <div id="cancelLookup">
      <input class="finp" id="c-phone" placeholder="טלפון *" type="tel" inputmode="numeric"/>
      <button class="fbtn" onclick="lookupCancels()">חפשי את האימונים שלי</button>
    </div>
    <div id="cancelList" style="display:none;margin-top:12px"></div>
    <div class="fmsg" id="cancel-msg"></div>
    <button class="cancel" onclick="closeCancelOverlay()">סגור</button>
  </div>
</div>
<div class="succ-overlay" id="succOverlay">
  <div class="succ-box">
    <div class="succ-icon">💪</div>
    <div class="succ-title" id="succ-title">נרשמת בהצלחה!</div>
    <p class="succ-msg" id="succ-msg"></p>
    <button class="succ-close" onclick="document.getElementById('succOverlay').classList.remove('on')">סגור</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyD3H-2M1cYEupObbeeRtlcMPHyQtzEjP1Q",authDomain:"orit-raz.firebaseapp.com",projectId:"orit-raz",storageBucket:"orit-raz.firebasestorage.app",messagingSenderId:"1093566537569",appId:"1:1093566537569:web:1123fc5926a543d9e1ef20"});
var db=firebase.firestore();
var SCHEDULE=[
  {day:'ראשון',slots:[{id:'sun-18',time:'18:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'},{id:'sun-19',time:'19:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'},{id:'sun-20',time:'20:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'}]},
  {day:'שני',slots:[{id:'mon-18',time:'18:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'},{id:'mon-19',time:'19:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'}]},
  {day:'שלישי',slots:[{id:'tue-18',time:'18:30',type:'פילאטיס',cap:7,instructor:'נעה כהן'}]},
  {day:'רביעי',slots:[{id:'wed-18',time:'18:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'},{id:'wed-19',time:'19:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'},{id:'wed-20',time:'20:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'}]},
  {day:'חמישי',slots:[{id:'thu-18',time:'18:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'},{id:'thu-19',time:'19:00',type:'פונקציונלי',cap:7,instructor:'אורית רז'}]},
  {day:'שישי',slots:[{id:'fri-08',time:'08:15',type:'נפח',cap:9,instructor:'אורית רז'}]}
];
var DAY_OFFSET={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5};
function getWeekSunday(off){var d=new Date();d.setDate(d.getDate()-d.getDay()+(off||0)*7);d.setHours(0,0,0,0);var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
var weekKey=getWeekSunday(0),nextWeekKey=getWeekSunday(1);
function wkLabel(wk){var sun=new Date(wk+'T00:00:00');var sat=new Date(sun);sat.setDate(sun.getDate()+6);var f=function(d){return d.toLocaleDateString('he-IL',{day:'numeric',month:'long'});};return f(sun)+' – '+f(sat);}
document.getElementById('weekBar').textContent='השבוע '+wkLabel(weekKey);
function findSlot(id){for(var i=0;i<SCHEDULE.length;i++)for(var j=0;j<SCHEDULE[i].slots.length;j++)if(SCHEDULE[i].slots[j].id===id)return SCHEDULE[i].slots[j];return null;}
var counts={},waits={},currentSlot=null,filterAvail=false,filterFavs=false,myPhone='',myRegs=new Set();
var loggedMember=null;
try{var _s=localStorage.getItem('orit-member-session');if(_s){loggedMember=JSON.parse(_s);}}catch(e){}

var FAVS_KEY='orit-favs';
function getFavs(){try{return JSON.parse(localStorage.getItem(FAVS_KEY)||'[]');}catch(e){return[];}}
function toggleFav(slotId,e){e.stopPropagation();var favs=getFavs();var i=favs.indexOf(slotId);if(i>=0)favs.splice(i,1);else favs.push(slotId);localStorage.setItem(FAVS_KEY,JSON.stringify(favs));renderGrid();}
function toggleFilterAvail(){filterAvail=!filterAvail;document.getElementById('filterAvail').classList.toggle('active',filterAvail);renderGrid();}
function toggleFilterFavs(){filterFavs=!filterFavs;document.getElementById('filterFavs').classList.toggle('active',filterFavs);renderGrid();}
function getDayDate(slotId,wk){var prefix=slotId.split('-')[0];var offset=DAY_OFFSET[prefix]||0;var d=new Date((wk||weekKey)+'T00:00:00');d.setDate(d.getDate()+offset);return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'});}
function slotDatetime(slotId,timeStr,wk){var prefix=slotId.split('-')[0];var offset=DAY_OFFSET[prefix]||0;var parts=timeStr.split(':');var sun=new Date((wk||weekKey)+'T00:00:00');sun.setDate(sun.getDate()+offset);sun.setHours(parseInt(parts[0]),parseInt(parts[1]),0,0);return sun;}
function canCancel(slotId,timeStr,wk){
  var prefix=slotId.split('-')[0];
  var now=Date.now();
  if(prefix==='fri'){
    // שישי: ביטול עד 19:00 של יום חמישי
    var sun=new Date((wk||weekKey)+'T00:00:00');
    var thu=new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+4);
    thu.setHours(19,0,0,0);
    return now<thu.getTime();
  }
  // א׳-ה׳: ביטול עד 12:00 של אותו יום
  var day=slotDatetime(slotId,timeStr,wk);
  day.setHours(12,0,0,0);
  return now<day.getTime();
}
function isLocked(slotId,timeStr,wk){return(slotDatetime(slotId,timeStr,wk).getTime()-Date.now())>7*24*60*60*1000;}
function isPast(slotId,timeStr,wk){return slotDatetime(slotId,timeStr,wk).getTime()<Date.now();}
function badgeHtml(count,cap,waitCount){var left=cap-count;var pct=Math.round((count/cap)*100);var barColor=left<=0?'#c62828':left<=2?'#e65100':'#2e7d32';var bar='<div style="margin-top:6px;background:#eee;border-radius:4px;height:5px;overflow:hidden"><div style="width:'+Math.min(100,pct)+'%;height:100%;background:'+barColor+';border-radius:4px;transition:.3s"></div></div>';var label='<div style="font-size:11px;color:#999;margin-top:3px">'+count+' תפוס · '+left+' פנוי</div>';if(left<=0){var wt=waitCount?'<div style="font-size:10px;color:#D63878;margin-top:2px">'+waitCount+' ממתינות</div>':'';return'<span class="badge badge-full">מלא</span>'+wt+bar;}return(left<=2?'<span class="badge badge-few">נותרו '+left+'</span>':'<span class="badge badge-ok">'+left+' מקומות</span>')+label+bar;}
function renderGrid(){
  var favs=getFavs();var html='';
  [[weekKey,'השבוע'],[nextWeekKey,'שבוע הבא']].forEach(function(wi){
    var wk=wi[0],wkTitle=wi[1];var weekHtml='';
    SCHEDULE.forEach(function(day){
      var sh='';
      day.slots.forEach(function(s){
        var key=wk+'_'+s.id;var c=counts[key]||0,w=waits[key]||0,full=c>=s.cap;
        var isFav=favs.indexOf(s.id)>=0,isMyBooking=myRegs.has(key);
        if(isPast(s.id,s.time,wk))return;
        if(filterAvail&&full&&!isMyBooking)return;
        if(filterFavs&&!isFav)return;
        var locked=isLocked(s.id,s.time,wk);
        var tooLate=!locked&&!isMyBooking&&!canCancel(s.id,s.time,wk);
        var click='';
        if(!isMyBooking&&!locked&&!tooLate)click=full?' onclick="openWaitlist(\''+s.id+'\',\''+wk+'\')"':' onclick="openModal(\''+s.id+'\',\''+wk+'\')"';
        sh+='<div class="slot'+(full&&!locked?' full':'')+(isFav?' fav':'')+(isMyBooking?' my-booking':'')+(locked?' locked':'')+'"'+click+'>';
        sh+='<button class="fav-btn" onclick="toggleFav(\''+s.id+'\',event)">'+(isFav?'<svg viewBox="0 0 24 24" fill="#e53935"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#e53935" stroke-width="1.8"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>')+'</button>';
        if(isMyBooking){
          var canCxl=canCancel(s.id,s.time,wk);
          sh+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'
            +'<span class="my-badge">✓ נרשמת</span>'
            +(canCxl?'<button onclick="quickCancel(\''+s.id+'\',\''+s.time+'\',\''+wk+'\',event)" style="background:#fce4ec;color:#c62828;border:none;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;min-width:60px">ביטול ✕</button>':'')
            +'</div>';
        }
        sh+='<div class="slot-time">'+s.time+'</div><div style="font-size:11px;color:#bbb;margin-top:1px;margin-bottom:2px">'+getDayDate(s.id,wk)+'</div><div class="slot-type">'+s.type+'</div><div class="slot-instructor">'+s.instructor+'</div>';
        if(locked){var openAt=new Date(slotDatetime(s.id,s.time,wk).getTime()-7*24*60*60*1000);sh+='<div style="font-size:11px;color:#bbb;margin-top:6px">🔒 נפתח '+openAt.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})+' '+openAt.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})+'</div>';}
        else if(tooLate)sh+='<div style="font-size:11px;color:#e24b4a;margin-top:6px">מאוחר מדי</div>';
        else{sh+=badgeHtml(c,s.cap,w);if(full)sh+='<div style="font-size:10px;color:#D63878;margin-top:4px">לרשימת המתנה ←</div>';}
        sh+='</div>';
      });
      if(sh){var dDate=getDayDate(day.slots[0].id,wk);weekHtml+='<div class="day-col"><div class="day-head">'+day.day+'<br><span style="font-size:11px;opacity:.8;font-weight:400">'+dDate+'</span></div>'+sh+'</div>';}
    });
    if(weekHtml)html+='<div class="week-label">'+wkTitle+' · '+wkLabel(wk)+'</div>'+weekHtml;
  });
  document.getElementById('grid').innerHTML=html||'<div style="grid-column:1/-1;text-align:center;padding:48px;color:#ccc;font-size:14px">אין אימונים להצגה</div>';
}
function loadBookings(){
  var keys=[];[weekKey,nextWeekKey].forEach(function(wk){SCHEDULE.forEach(function(d){d.slots.forEach(function(s){keys.push(wk+'_'+s.id);});});});
  Promise.all(keys.map(function(k){return db.collection('bookings').doc(k).get().then(function(doc){counts[k]=doc.exists?Object.keys(doc.data().registrations||{}).length:0;waits[k]=doc.exists?Object.keys(doc.data().waitlist||{}).length:0;});})).then(renderGrid);
}
function lookupMyBookings(){
  var ph=document.getElementById('my-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  if(!ph||ph.length<9)return;
  myPhone=ph;myRegs.clear();
  var keys=[];[weekKey,nextWeekKey].forEach(function(wk){SCHEDULE.forEach(function(d){d.slots.forEach(function(s){keys.push(wk+'_'+s.id);});});});
  Promise.all(keys.map(function(k){return db.collection('bookings').doc(k).get().then(function(doc){if(doc.exists&&(doc.data().registrations||{})[ph])myRegs.add(k);});})).then(function(){renderGrid();document.getElementById('logoutBtn').style.display=myRegs.size?'inline-block':'none';});
}
function setModalMemberMode(){
  var loggedEl=document.getElementById('logged-as');
  if(loggedMember){
    loggedEl.textContent='✓ נרשמת בשם: '+loggedMember.name;
    loggedEl.style.display='block';
    document.getElementById('b-name').style.display='none';
    document.getElementById('b-phone').style.display='none';
  } else {
    loggedEl.style.display='none';
    document.getElementById('b-name').style.display='block';
    document.getElementById('b-phone').style.display='block';
  }
}
function openWaitlist(slotId,wk){
  var s=findSlot(slotId);if(!s)return;
  currentSlot=Object.assign({},s,{wkey:wk||weekKey});
  document.getElementById('modal-title').textContent=s.type+' · '+s.time+' — מלא';
  document.getElementById('modal-sub').textContent='הצטרפי לרשימת המתנה — אם יתפנה מקום תועברי אוטומטית';
  document.getElementById('b-name').value='';document.getElementById('b-phone').value='';
  document.getElementById('book-msg').textContent='';
  document.getElementById('book-btn').textContent='הצטרפי לרשימת המתנה ⏳';
  document.getElementById('book-btn').disabled=false;
  document.getElementById('book-btn').onclick=confirmWaitlist;
  setModalMemberMode();
  document.getElementById('overlay').classList.add('on');
}
function confirmWaitlist(){
  var name=loggedMember?loggedMember.name:document.getElementById('b-name').value.trim();
  var phone=loggedMember?loggedMember.phone:document.getElementById('b-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var msg=document.getElementById('book-msg');msg.style.color='#e24b4a';
  if(!name){msg.textContent='נא להכניס שם';return;}
  if(!phone||phone.length<9){msg.textContent='מספר טלפון לא תקין';return;}
  var s=currentSlot,wk=s.wkey||weekKey;
  document.getElementById('book-btn').disabled=true;msg.style.color='#888';msg.textContent='מעבד...';
  var ref=db.collection('bookings').doc(wk+'_'+s.id);
  db.runTransaction(function(t){return t.get(ref).then(function(doc){
    var regs=doc.exists?(doc.data().registrations||{}):{};var wl=doc.exists?(doc.data().waitlist||{}):{};
    if(regs[phone])throw new Error('already');if(wl[phone])throw new Error('inwait');
    wl[phone]={name:name,phone:phone,at:new Date().toISOString(),pos:Object.keys(wl).length+1};
    t.set(ref,{waitlist:wl},{merge:true});
  });}).then(function(){
    waits[wk+'_'+s.id]=(waits[wk+'_'+s.id]||0)+1;closeModal();renderGrid();
    document.getElementById('succ-title').textContent='נרשמת לרשימת המתנה ⏳';
    document.getElementById('succ-msg').textContent=name+', נוספת לרשימת המתנה לאימון בשעה '+s.time+'.\nאם יתפנה מקום — תועברי אוטומטית!';
    document.getElementById('succOverlay').classList.add('on');
  }).catch(function(e){document.getElementById('book-btn').disabled=false;msg.style.color='#e24b4a';if(e.message==='already')msg.textContent='את כבר רשומה לאימון זה';else if(e.message==='inwait')msg.textContent='את כבר ברשימת המתנה';else msg.textContent='שגיאה, נסי שוב';});
}
function openModal(slotId,wk){
  var s=findSlot(slotId);if(!s)return;
  currentSlot=Object.assign({},s,{wkey:wk||weekKey});
  document.getElementById('modal-title').textContent=s.type+' · '+s.time;
  document.getElementById('modal-sub').textContent=loggedMember?'אישורי הרשמה לאימון':'מלאי פרטים ונרשמך לאימון';
  document.getElementById('b-name').value='';document.getElementById('b-phone').value='';
  document.getElementById('book-msg').textContent='';document.getElementById('book-btn').disabled=false;
  document.getElementById('book-btn').textContent='אני רוצה להירשם 🩷';
  document.getElementById('book-btn').onclick=confirmBook;
  setModalMemberMode();
  document.getElementById('overlay').classList.add('on');
  if(!loggedMember)document.getElementById('b-name').focus();
}
function closeModal(){document.getElementById('overlay').classList.remove('on');document.getElementById('book-btn').textContent='אני רוצה להירשם 🩷';document.getElementById('book-btn').onclick=confirmBook;}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
function confirmBook(){
  var name=loggedMember?loggedMember.name:document.getElementById('b-name').value.trim();
  var phone=loggedMember?loggedMember.phone:document.getElementById('b-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var msg=document.getElementById('book-msg');msg.style.color='#e24b4a';
  if(!name){msg.textContent='נא להכניס שם';return;}if(!phone||phone.length<9){msg.textContent='מספר טלפון לא תקין';return;}
  var s=currentSlot,wk=s.wkey||weekKey;
  document.getElementById('book-btn').disabled=true;msg.style.color='#888';msg.textContent='מעבד...';
  // בדיקת הזמנה כפולה באותו יום
  var dayPrefix=slotDayPrefix(s.id);
  var sameDayKeys=[];
  SCHEDULE.forEach(function(d){d.slots.forEach(function(sl){if(slotDayPrefix(sl.id)===dayPrefix&&sl.id!==s.id)sameDayKeys.push(wk+'_'+sl.id);});});
  Promise.all(sameDayKeys.map(function(k){return db.collection('bookings').doc(k).get();})).then(function(docs){
    var alreadyDay=docs.some(function(doc){return doc.exists&&(doc.data().registrations||{})[phone];});
    if(alreadyDay){document.getElementById('book-btn').disabled=false;msg.style.color='#e24b4a';msg.textContent='כבר יש לך אימון ביום זה';return;}
    doBookTransaction(s,wk,phone,name,msg);
  }).catch(function(){document.getElementById('book-btn').disabled=false;msg.style.color='#e24b4a';msg.textContent='שגיאה, נסי שוב';});
}
function doBookTransaction(s,wk,phone,name,msg){
  var ref=db.collection('bookings').doc(wk+'_'+s.id);
  db.runTransaction(function(t){return t.get(ref).then(function(doc){
    var regs=doc.exists?(doc.data().registrations||{}):{};
    if(Object.keys(regs).length>=s.cap)throw new Error('full');if(regs[phone])throw new Error('dup');
    regs[phone]={name:name,phone:phone,at:new Date().toISOString()};
    t.set(ref,{registrations:regs,slotId:s.id,weekKey:wk,type:s.type,time:s.time},{merge:true});
  });}).then(function(){
    counts[wk+'_'+s.id]=(counts[wk+'_'+s.id]||0)+1;closeModal();renderGrid();
    document.getElementById('succ-title').textContent='נרשמת! 🩷';
    document.getElementById('succ-msg').textContent=name+', נרשמת לאימון '+s.type+' בשעה '+s.time+'.\nנתראה בסטודיו!';
    document.getElementById('succOverlay').classList.add('on');
    try{db.collection('members').doc(phone).update({trainings:firebase.firestore.FieldValue.arrayUnion({slotId:s.id,type:s.type,time:s.time,classDate:slotDatetime(s.id,s.time,wk).toISOString(),weekKey:wk,status:'booked'})}).catch(function(){});}catch(e2){}
  }).catch(function(e){document.getElementById('book-btn').disabled=false;msg.style.color='#e24b4a';if(e.message==='full')msg.textContent='😔 האימון הזה מלא';else if(e.message==='dup')msg.textContent='מספר זה כבר רשום לאימון';else msg.textContent='שגיאה, נסי שוב';});
}
function clearMyBookings(){myPhone='';myRegs.clear();document.getElementById('my-phone').value='';document.getElementById('logoutBtn').style.display='none';renderGrid();}
function quickCancel(slotId,timeStr,wk,e){e.stopPropagation();if(!myPhone){return;}doCancel(slotId,timeStr,myPhone,wk);}
function openCancelLookup(){document.getElementById('c-phone').value='';document.getElementById('cancelList').style.display='none';document.getElementById('cancel-msg').textContent='';document.getElementById('cancelLookup').style.display='block';document.getElementById('cancelOverlay').classList.add('on');}
function closeCancelOverlay(){document.getElementById('cancelOverlay').classList.remove('on');}
document.getElementById('cancelOverlay').addEventListener('click',function(e){if(e.target===this)closeCancelOverlay();});
function lookupCancels(){
  var phone=document.getElementById('c-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var msg=document.getElementById('cancel-msg');
  if(!phone||phone.length<9){msg.style.color='#e24b4a';msg.textContent='מספר לא תקין';return;}
  msg.style.color='#888';msg.textContent='מחפש...';
  var items=[];[weekKey,nextWeekKey].forEach(function(wk){SCHEDULE.forEach(function(d){d.slots.forEach(function(s){items.push({slot:s,wk:wk});});});});
  Promise.all(items.map(function(it){return db.collection('bookings').doc(it.wk+'_'+it.slot.id).get().then(function(doc){return{slot:it.slot,wk:it.wk,doc:doc};});})).then(function(results){
    msg.textContent='';
    var mine=results.filter(function(r){return r.doc.exists&&(r.doc.data().registrations||{})[phone];});
    if(mine.length===0){msg.style.color='#e24b4a';msg.textContent='לא נמצאו הרשמות לטלפון זה';return;}
    document.getElementById('cancelLookup').style.display='none';
    var html='<div style="font-size:13px;font-weight:700;color:#888;margin-bottom:10px">האימונים שלך:</div>';
    mine.forEach(function(r){
      var s=r.slot,wk=r.wk,ok=canCancel(s.id,s.time,wk);
      var dt=slotDatetime(s.id,s.time,wk);
      var dayStr=dt.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'});
      html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #FFF0F6"><div><div style="font-weight:700;font-size:14px">'+s.type+' · '+s.time+'</div><div style="font-size:12px;color:#999">'+dayStr+'</div></div>';
      if(ok){html+='<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end"><button onclick="doCancel(\''+s.id+'\',\''+s.time+'\',\''+phone+'\',\''+wk+'\')" style="background:#fce4ec;color:#c62828;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">ביטול</button><button onclick="openMove(\''+s.id+'\',\''+s.time+'\',\''+phone+'\',\''+wk+'\')" style="background:#e8f5e9;color:#2e7d32;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer">הזזה ←</button></div>';}
      else{html+='<span style="font-size:12px;color:#e24b4a;font-weight:700">מאוחר מדי לביטול</span>';}
      html+='</div>';
    });
    document.getElementById('cancelList').innerHTML=html;document.getElementById('cancelList').style.display='block';
  }).catch(function(){msg.style.color='#e24b4a';msg.textContent='שגיאה, נסי שוב';});
}
function slotDayPrefix(id){return id.split('-')[0];}
function openMove(fromSlotId,fromTime,phone,wk){
  wk=wk||weekKey;var dayPrefix=slotDayPrefix(fromSlotId);var sameDay=[];
  SCHEDULE.forEach(function(d){d.slots.forEach(function(s){if(slotDayPrefix(s.id)===dayPrefix&&s.id!==fromSlotId){var left=s.cap-(counts[wk+'_'+s.id]||0);if(left>0&&canCancel(s.id,s.time,wk))sameDay.push(s);}});});
  if(sameDay.length===0){document.getElementById('cancel-msg').style.color='#e24b4a';document.getElementById('cancel-msg').textContent='אין שעות פנויות אחרות באותו יום';return;}
  document.getElementById('cancel-msg').textContent='';
  var html='<div style="font-size:13px;font-weight:700;color:#888;margin-bottom:8px">בחרי שעה חדשה:</div>';
  sameDay.forEach(function(s){html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #FFF0F6"><div><div style="font-weight:700;font-size:14px">'+s.type+' · '+s.time+'</div><div style="font-size:12px;color:#aaa">נותרו '+(s.cap-(counts[wk+'_'+s.id]||0))+' מקומות</div></div><button onclick="doMove(\''+fromSlotId+'\',\''+s.id+'\',\''+s.time+'\',\''+phone+'\',\''+wk+'\')" style="background:#D63878;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer">הזזה ←</button></div>';});
  html+='<button onclick="lookupCancels()" style="background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;margin-top:10px;padding:4px">← חזרה</button>';
  document.getElementById('cancelList').innerHTML=html;
}
function doMove(fromId,toId,toTime,phone,wk){
  wk=wk||weekKey;var fromSlot=findSlot(fromId);
  if(!canCancel(fromId,fromSlot.time,wk)){document.getElementById('cancel-msg').textContent='מאוחר מדי לשינוי';return;}
  var fromRef=db.collection('bookings').doc(wk+'_'+fromId);var toRef=db.collection('bookings').doc(wk+'_'+toId);var toSlot=findSlot(toId);
  db.runTransaction(function(t){return Promise.all([t.get(fromRef),t.get(toRef)]).then(function(docs){var fromRegs=docs[0].exists?(docs[0].data().registrations||{}):{};var toRegs=docs[1].exists?(docs[1].data().registrations||{}):{};var reg=fromRegs[phone];if(!reg)throw new Error('notfound');if(Object.keys(toRegs).length>=toSlot.cap)throw new Error('full');delete fromRegs[phone];toRegs[phone]=reg;t.set(fromRef,{registrations:fromRegs},{merge:true});t.set(toRef,{registrations:toRegs,slotId:toId,weekKey:wk,type:toSlot.type,time:toSlot.time},{merge:true});});}).then(function(){
    counts[wk+'_'+fromId]=Math.max(0,(counts[wk+'_'+fromId]||1)-1);counts[wk+'_'+toId]=(counts[wk+'_'+toId]||0)+1;renderGrid();closeCancelOverlay();
    document.getElementById('succ-title').textContent='ההרשמה הוזזה! 🩷';document.getElementById('succ-msg').textContent='הועברת לאימון בשעה '+toTime+'. נתראה בסטודיו!';document.getElementById('succOverlay').classList.add('on');
    db.collection('members').doc(phone).get().then(function(d){if(!d.exists)return;var tr=(d.data().trainings||[]).map(function(t){return(t.weekKey===wk&&t.slotId===fromId)?Object.assign({},t,{status:'moved'}):t;});tr.push({slotId:toId,type:toSlot?toSlot.type:'',time:toTime,classDate:slotDatetime(toId,toTime,wk).toISOString(),weekKey:wk,status:'booked'});db.collection('members').doc(phone).update({trainings:tr}).catch(function(){});}).catch(function(){});
  }).catch(function(e){document.getElementById('cancel-msg').style.color='#e24b4a';document.getElementById('cancel-msg').textContent=e.message==='full'?'האימון הזה מלא':'שגיאה, נסי שוב';});
}
function doCancel(slotId,timeStr,phone,wk){
  wk=wk||weekKey;
  if(!canCancel(slotId,timeStr,wk)){alert('לא ניתן לבטל — פג המועד לביטול');return;}
  var ref=db.collection('bookings').doc(wk+'_'+slotId);
  ref.get().then(function(doc){
    var regs=doc.exists?(doc.data().registrations||{}):{};
    var wl=doc.exists?(doc.data().waitlist||{}):{};
    var promoted=null;
    delete regs[phone];
    var waitKeys=Object.keys(wl).sort(function(a,b){return(wl[a].at||'')>(wl[b].at||'')?1:-1;});
    if(waitKeys.length>0){var nextPhone=waitKeys[0];promoted=wl[nextPhone];regs[nextPhone]=promoted;delete wl[nextPhone];}
    return ref.set({registrations:regs,waitlist:wl},{merge:true}).then(function(){
      myRegs.delete(wk+'_'+slotId);
      counts[wk+'_'+slotId]=Math.max(0,(counts[wk+'_'+slotId]||1)-(promoted?0:1));
      waits[wk+'_'+slotId]=Math.max(0,(waits[wk+'_'+slotId]||1)-(promoted?1:0));
      renderGrid();closeCancelOverlay();
      document.getElementById('succ-title').textContent='ההרשמה בוטלה 💪';
      document.getElementById('succ-msg').textContent='ההרשמה לאימון בשעה '+timeStr+' בוטלה.'+(promoted?'\n\n'+promoted.name+' הועברה מרשימת ההמתנה!':'');
      document.getElementById('succOverlay').classList.add('on');
      if(promoted&&promoted.phone){
        var waPhone=promoted.phone.replace(/^0/,'972');
        var waMsg=encodeURIComponent('היי '+promoted.name+' 🩷\nמקום התפנה! את מועברת מרשימת ההמתנה לאימון בשעה '+timeStr+'.\nנתראה בסטודיו! 💪');
        setTimeout(function(){window.open('https://wa.me/'+waPhone+'?text='+waMsg,'_blank');},500);
      }
      db.collection('members').doc(phone).get().then(function(d){if(!d.exists)return;var tr=(d.data().trainings||[]).map(function(t){return(t.weekKey===wk&&t.slotId===slotId)?Object.assign({},t,{status:'cancelled'}):t;});db.collection('members').doc(phone).update({trainings:tr}).catch(function(){});}).catch(function(){});
    });
  }).catch(function(e){alert('שגיאה בביטול: '+(e.message||'נסי שוב'));});
}
loadBookings();
if(loggedMember){
  myPhone=loggedMember.phone;
  document.getElementById('my-phone').value=loggedMember.phone;
  var keys2=[];[weekKey,nextWeekKey].forEach(function(wk){SCHEDULE.forEach(function(d){d.slots.forEach(function(s){keys2.push(wk+'_'+s.id);});});});
  Promise.all(keys2.map(function(k){return db.collection('bookings').doc(k).get().then(function(doc){if(doc.exists&&(doc.data().registrations||{})[loggedMember.phone])myRegs.add(k);});})).then(function(){renderGrid();document.getElementById('logoutBtn').style.display=myRegs.size?'inline-block':'none';});
}
</script>

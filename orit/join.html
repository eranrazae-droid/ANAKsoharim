<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצטרפות לסטודיו — אורית רז</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;background:#FAF5F5;min-height:100vh;direction:rtl}
.topbar{background:#C4A0A0;color:#fff;padding:16px 20px;text-align:center}
.topbar h1{font-size:19px;font-weight:800;margin-bottom:2px}
.topbar p{font-size:12px;opacity:.75}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 48px}
.steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px}
.step-dot{width:32px;height:32px;border-radius:50%;border:2px solid #E0C8B4;color:#D8C0BC;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff;transition:.3s}
.step-dot.done{background:#C4A0A0;border-color:#C4A0A0;color:#fff}
.step-dot.active{border-color:#C4A0A0;color:#C4A0A0}
.step-line{flex:1;max-width:80px;height:2px;background:#EDD8D5}
.step-line.done{background:#C4A0A0}
.card{background:#fff;border-radius:16px;padding:28px;border:1px solid #EDD8D5;box-shadow:0 2px 12px rgba(184,133,90,.07)}
.card h2{font-size:20px;font-weight:800;color:#C4A0A0;margin-bottom:6px}
.card-sub{font-size:13px;color:#999;margin-bottom:24px}
.finp{width:100%;border:1.5px solid #EDD8D5;border-radius:10px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;direction:rtl;margin-bottom:14px;color:#222;background:#fff}
.finp:focus{border-color:#C4A0A0;background:#FAF5F5}
.flabel{font-size:12px;font-weight:700;color:#8A6868;margin-bottom:5px;display:block}
.plans{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.plan{border:2px solid #EDD8D5;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.plan:hover{border-color:#D8C0BC;background:#FAF5F5}
.plan.sel{border-color:#C4A0A0;background:#FAF5F5}
.plan-left{display:flex;align-items:center;gap:12px}
.plan-radio{width:18px;height:18px;border-radius:50%;border:2px solid #D8C0BC;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
.plan.sel .plan-radio{border-color:#C4A0A0;background:#C4A0A0}
.plan.sel .plan-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;display:block}
.plan-name{font-size:15px;font-weight:700;color:#222}
.plan-note{font-size:11px;color:#999;margin-top:2px}
.plan-price{font-size:20px;font-weight:900;color:#C4A0A0;white-space:nowrap}
.plan-price span{font-size:12px;font-weight:400;color:#999}
.btn-next{width:100%;background:#C4A0A0;color:#fff;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;transition:.2s}
.btn-next:hover{background:#A88484}
.btn-next:disabled{opacity:.5;cursor:not-allowed}
.btn-back{width:100%;background:none;border:none;color:#999;font-size:14px;cursor:pointer;margin-top:10px;padding:8px;font-family:inherit}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #EDD8D5;font-size:14px}
.summary-row:last-child{border-bottom:none;font-weight:800;font-size:16px;color:#C4A0A0}
.summary-label{color:#888}
.payment-note{background:#FAF5F5;border-radius:10px;padding:14px;font-size:13px;color:#666;line-height:1.6;margin-bottom:20px;text-align:center}
.err{color:#e24b4a;font-size:13px;text-align:center;margin-top:8px;min-height:18px}
.divider{height:1px;background:#EDD8D5;margin:20px 0}
</style>
</head>
<body>
<div class="topbar">
  <h1>💜 הצטרפות לסטודיו</h1>
  <p>אורית רז — בוטיק כושר לנשים</p>
</div>
<div class="wrap">
  <div class="steps" id="stepsBar">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2">2</div>
  </div>

  <!-- שלב 1: פרטים אישיים + בחירת מנוי -->
  <div id="step1">
    <div class="card">
      <h2>פרטים ובחירת מנוי</h2>
      <p class="card-sub">כמה פרטים קצרים ונבחר יחד את המסלול המתאים 🌸</p>
      <label class="flabel">שם מלא *</label>
      <input class="finp" id="j-name" placeholder="שם פרטי ומשפחה" autocomplete="name"/>
      <label class="flabel">טלפון *</label>
      <input class="finp" id="j-phone" placeholder="05X-XXXXXXX" type="tel" inputmode="numeric" autocomplete="tel"/>
      <label class="flabel">אימייל (אופציונלי)</label>
      <input class="finp" id="j-email" placeholder="your@email.com" type="email" autocomplete="email" style="direction:ltr;text-align:right"/>
      <div class="divider"></div>
      <label class="flabel" style="font-size:14px;margin-bottom:12px">בחרי מנוי:</label>
      <div class="plans" id="plansList"></div>
      <div class="err" id="err1"></div>
      <button class="btn-next" onclick="goStep2()">המשך לסיכום ←</button>
      <button class="btn-back" onclick="window.location.href='index.html'">← חזרה לאתר</button>
    </div>
  </div>

  <!-- שלב 2: סיכום ותשלום -->
  <div id="step2" style="display:none">
    <div class="card">
      <h2>סיכום והרשמה</h2>
      <p class="card-sub">בדקי שהכל נכון לפני התשלום</p>
      <div id="summaryRows"></div>
      <div class="payment-note">
        🔒 התשלום מתבצע בצורה מאובטחת דרך PayMe — הקבלה תישלח אוטומטית
      </div>
      <div class="err" id="err2"></div>
      <button class="btn-next" id="payBtn" onclick="submitAndPay()">לתשלום מאובטח ←</button>
      <button class="btn-back" onclick="goToStep(1)">← חזרה</button>
    </div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyD3H-2M1cYEupObbeeRtlcMPHyQtzEjP1Q",authDomain:"orit-raz.firebaseapp.com",projectId:"orit-raz",storageBucket:"orit-raz.firebasestorage.app",messagingSenderId:"1093566537569",appId:"1:1093566537569:web:1123fc5926a543d9e1ef20"});
var db=firebase.firestore();
var PLANS=[
  {id:'1x',name:'פעם בשבוע',note:'אימוני כוח',price:280,icon:'💪',payUrl:'https://live.payme.io/subscription/template/SUB17861-72480KNK-APDQASBE-JTH2VHLY'},
  {id:'2x',name:'פעמיים בשבוע',note:'אימוני כוח',price:400,icon:'💪💪',payUrl:'https://live.payme.io/subscription/template/SUB17861-72641DOQ-ZRURNXAA-W8GL2YUC'},
  {id:'3x',name:'שלוש פעמים בשבוע',note:'אימוני כוח',price:450,icon:'🔥',payUrl:'https://live.payme.io/subscription/template/SUB17861-72735ZZQ-ERAB1U32-ANAZMIET'},
  {id:'ul',name:'ללא הגבלה',note:'אימוני כוח',price:480,icon:'⚡',payUrl:'https://live.payme.io/subscription/template/SUB17861-72792BQR-NC5IULYM-PLZAKUHR'},
  {id:'pi',name:'פילאטיס בלבד',note:'פעם בשבוע · 90 ₪ לאימון',price:360,icon:'🧘',payUrl:'https://live.payme.io/subscription/template/SUB17861-72876MED-RH6AZQGM-XOB85ATU'},
  {id:'trial',name:'אימון ניסיון',note:'חד פעמי · ללא התחייבות',price:60,icon:'🌟',payUrl:'https://live.payme.io/sale/template/SALE1786-172932DI-JPBT0US7-ROEYM82Z'},
];
var selectedPlan=null;
document.getElementById('plansList').innerHTML=PLANS.map(function(p){
  return '<div class="plan" id="pl-'+p.id+'" onclick="selectPlan(\''+p.id+'\')">'
    +'<div class="plan-left"><div class="plan-radio" id="pr-'+p.id+'"></div>'
    +'<div><div class="plan-name">'+p.icon+' '+p.name+'</div><div class="plan-note">'+p.note+'</div></div></div>'
    +'<div class="plan-price">'+p.price+' <span>₪/חודש</span></div></div>';
}).join('');
function selectPlan(id){
  PLANS.forEach(function(p){document.getElementById('pl-'+p.id).classList.remove('sel');});
  document.getElementById('pl-'+id).classList.add('sel');
  selectedPlan=PLANS.find(function(p){return p.id===id;});
  document.getElementById('err1').textContent='';
}
function goToStep(n){
  [1,2].forEach(function(i){document.getElementById('step'+i).style.display=i===n?'block':'none';});
  var dot1=document.getElementById('dot1'),dot2=document.getElementById('dot2'),line1=document.getElementById('line1');
  if(n===1){dot1.className='step-dot active';dot2.className='step-dot';line1.className='step-line';}
  else{dot1.className='step-dot done';dot2.className='step-dot active';line1.className='step-line done';}
  window.scrollTo(0,0);
}
function goStep2(){
  var name=document.getElementById('j-name').value.trim();
  var phone=document.getElementById('j-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var err=document.getElementById('err1');
  if(!name){err.textContent='נא להכניס שם מלא';return;}
  if(!phone||phone.length<9){err.textContent='נא להכניס מספר טלפון תקין';return;}
  if(!selectedPlan){err.textContent='נא לבחור מנוי';return;}
  err.textContent='';
  var p=selectedPlan;
  document.getElementById('summaryRows').innerHTML=
    row('שם',name)+row('טלפון',phone)+row('מנוי',p.icon+' '+p.name)+row('סכום חודשי',p.price+' ₪');
  goToStep(2);
}
function row(l,v){return '<div class="summary-row"><span class="summary-label">'+l+'</span><span>'+v+'</span></div>';}
function submitAndPay(){
  var btn=document.getElementById('payBtn');
  var err=document.getElementById('err2');
  btn.disabled=true;btn.textContent='שומר פרטים...';err.textContent='';
  var name=document.getElementById('j-name').value.trim();
  var phone=document.getElementById('j-phone').value.trim().replace(/[\s\-\(\)]/g,'');
  var email=document.getElementById('j-email').value.trim();
  var p=selectedPlan;
  var regId='reg_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);
  db.collection('members').doc(phone).set({
    name:name,phone:phone,email:email,plan:p.id,planName:p.name,amount:p.price,
    status:'pending_payment',regId:regId,
    joinDate:new Date().toLocaleDateString('he-IL'),createdAt:new Date().toISOString()
  }).then(function(){
    window.location.href=p.payUrl;
  }).catch(function(e){
    btn.disabled=false;btn.textContent='לתשלום מאובטח ←';
    err.textContent='שגיאה בשמירת הפרטים. נסי שוב.';
    console.error(e);
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ברוכה הבאה — אורית רז</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;background:#FAF5F5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl}
.card{background:#fff;border-radius:20px;padding:40px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(184,133,90,.12)}
.icon{font-size:72px;margin-bottom:20px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
h1{font-size:24px;font-weight:800;color:#C4A0A0;margin-bottom:8px}
.sub{font-size:15px;color:#666;line-height:1.7;margin-bottom:28px}
.detail{background:#FAF5F5;border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:14px;color:#C4A0A0;font-weight:600}
.detail span{color:#888;font-weight:400;font-size:13px;display:block;margin-bottom:4px}
.btn{background:#C4A0A0;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;margin:6px}
.btn-outline{background:#fff;color:#C4A0A0;border:2px solid #C4A0A0}
/* Modal שאלון בריאות */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;padding:36px 28px;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2);position:relative}
.modal-icon{font-size:52px;margin-bottom:12px}
.modal h2{font-size:20px;font-weight:800;color:#C4A0A0;margin-bottom:10px}
.modal p{font-size:14px;color:#555;line-height:1.7;margin-bottom:24px}
.modal .btn-quiz{width:100%;background:#C4A0A0;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:block;margin-bottom:10px}
.modal .btn-later{width:100%;background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;font-family:inherit;padding:6px}
</style>
</head>
<body>

<!-- חלון שאלון בריאות -->
<div class="overlay" id="quizOverlay">
  <div class="modal">
    <div class="modal-icon">📋</div>
    <h2>שלב אחרון לפני האימון</h2>
    <p>כדי להשתבץ לאימון, עלייך למלא <strong>הצהרת בריאות</strong>.<br>זה לוקח כ-2 דקות ואנחנו חייבים לפי חוק.</p>
    <a class="btn-quiz" href="index.html?nav=quiz">למילוי הצהרת הבריאות ←</a>
    <button class="btn-later" onclick="document.getElementById('quizOverlay').style.display='none'">אמלא מאוחר יותר</button>
  </div>
</div>

<div class="card">
  <div class="icon">🎉</div>
  <h1 id="title">ברוכה הבאה לסטודיו!</h1>
  <p class="sub" id="sub">התשלום התקבל בהצלחה.<br>אורית תיצור איתך קשר לאישור ולפרטי ההגעה.</p>
  <div class="detail" id="detail" style="display:none">
    <span>תוכנית שנבחרה</span>
    <span id="d-plan"></span>
  </div>
  <a class="btn" href="book.html">הרשמי לאימון הראשון ←</a><br>
  <a class="btn btn-outline" href="index.html">חזרה לאתר</a>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyD3H-2M1cYEupObbeeRtlcMPHyQtzEjP1Q",
  authDomain:"orit-raz.firebaseapp.com",
  projectId:"orit-raz",
  storageBucket:"orit-raz.firebasestorage.app",
  messagingSenderId:"1093566537569",
  appId:"1:1093566537569:web:1123fc5926a543d9e1ef20"
});
var db = firebase.firestore();
var params = new URLSearchParams(window.location.search);
var regId = params.get('regId');
var name = params.get('name');
var plan = params.get('plan');
var amount = params.get('amount');
if(name) document.getElementById('title').textContent = 'ברוכה הבאה, '+name+'! 🩷';
if(plan){
  document.getElementById('detail').style.display='block';
  document.getElementById('d-plan').textContent = plan + (amount?' · '+amount+' ₪ לחודש':'');
}
if(regId){
  db.collection('members').where('regId','==',regId).get().then(function(snap){
    snap.forEach(function(doc){
      doc.ref.update({status:'paid', paidAt: new Date().toISOString()});
    });
  });
}
</script>
</body>
</html>

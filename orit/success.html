<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ברוכה הבאה — אורית רז</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;background:#f5f0fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl}
.card{background:#fff;border-radius:20px;padding:40px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(91,58,126,.12)}
.icon{font-size:72px;margin-bottom:20px;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
h1{font-size:24px;font-weight:800;color:#5B3A7E;margin-bottom:8px}
.sub{font-size:15px;color:#666;line-height:1.7;margin-bottom:28px}
.detail{background:#f5f0fb;border-radius:10px;padding:14px 16px;margin-bottom:20px;font-size:14px;color:#5B3A7E;font-weight:600}
.detail span{color:#888;font-weight:400;font-size:13px;display:block;margin-bottom:4px}
.btn{background:#5B3A7E;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;margin:6px}
.btn-outline{background:#fff;color:#5B3A7E;border:2px solid #5B3A7E}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1 id="title">ברוכה הבאה לסטודיו!</h1>
  <p class="sub" id="sub">התשלום התקבל בהצלחה.<br>אורית תיצור איתך קשר לאישור ולפרטי ההגעה.</p>
  <div class="detail" id="detail" style="display:none">
    <span>תוכנית שנבחרה</span>
    <span id="d-plan"></span>
  </div>
  <a class="btn" href="book.html">הרשמי לאימון הראשון ←</a><br>
  <a class="btn btn-outline" href="index.html">חזרה לאתר</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyD3H-2M1cYEupObbeeRtlcMPHyQtzEjP1Q",
  authDomain:"orit-raz.firebaseapp.com",
  projectId:"orit-raz",
  storageBucket:"orit-raz.firebasestorage.app",
  messagingSenderId:"1093566537569",
  appId:"1:1093566537569:web:1123fc5926a543d9e1ef20"
});
var db = firebase.firestore();

var params = new URLSearchParams(window.location.search);
var regId = params.get('regId');
var name = params.get('name');
var plan = params.get('plan');
var amount = params.get('amount');

if(name) document.getElementById('title').textContent = 'ברוכה הבאה, '+name+'! 💜';
if(plan){
  document.getElementById('detail').style.display='block';
  document.getElementById('d-plan').textContent = plan + (amount?' · '+amount+' ₪ לחודש':'');
}

if(regId){
  db.collection('members').where('regId','==',regId).get().then(function(snap){
    snap.forEach(function(doc){
      doc.ref.update({status:'paid', paidAt: new Date().toISOString()});
    });
  });
}
</script>
</body>
</html>

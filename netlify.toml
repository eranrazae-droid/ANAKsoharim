[functions]
  directory = "netlify/functions"

# פיד קטלוג ציבורי וקבוע ל-Meta
[[redirects]]
  from = "/catalog.xml"
  to = "/.netlify/functions/catalog-xml"
  status = 200

# Sitemap דינמי ל-Google (כולל כל עמודי הרכב) — force מכריח על פני קובץ סטטי
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/catalog.csv"
  to = "/.netlify/functions/catalog-feed"
  status = 200

# נתיבים ידידותיים למיגרציית מזהי Meta (עוקפים חוסמי פרסומות שחוסמים /.netlify/functions/)
[[redirects]]
  from = "/admin-api/meta-id-migration/preview"
  to = "/.netlify/functions/migrate-metaids"
  status = 200

[[redirects]]
  from = "/admin-api/meta-id-migration/apply"
  to = "/.netlify/functions/migrate-metaids"
  status = 200

[[redirects]]
  from = "/admin-api/mark-paid"
  to = "/.netlify/functions/mark-paid"
  status = 200

[[redirects]]
  from = "/admin-api/social-publish"
  to = "/.netlify/functions/social-publish"
  status = 200

# דף נחיתה לקמפיינים — כתובת נקייה /deal
[[redirects]]
  from = "/deal"
  to = "/lp.html"
  status = 200

# SSR לעמוד רכב בודד — כשיש ?car=<id> מגישים HTML עם meta ייחודי (canonical עצמי)
# כדי שגוגל יאנדקס כל רכב בנפרד. force מכריח על פני קובץ index.html הסטטי.
[[redirects]]
  from = "/"
  query = { car = ":carid" }
  to = "/.netlify/functions/car-page?id=:carid"
  status = 200
  force = true


[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

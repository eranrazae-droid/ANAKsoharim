<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="אולם תצוגה">
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141419"/><stop offset=".55" stop-color="#1d1d24"/><stop offset="1" stop-color="#0b0b0e"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#23232b"/><stop offset="1" stop-color="#0d0d11"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c2c36"/><stop offset="1" stop-color="#16161c"/>
  </linearGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f2f2f4"/><stop offset=".55" stop-color="#c9c9d2"/><stop offset="1" stop-color="#8f8f9c"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c57f" stop-opacity=".55"/><stop offset="1" stop-color="#e8c57f" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="spot" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000" stop-opacity=".82"/><stop offset=".48" stop-color="#000" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity=".1"/>
  </linearGradient>
</defs>

<rect width="1600" height="760" fill="url(#room)"/>

<!-- חלונות ראווה בקיר האחורי -->
<g opacity=".9">
  <rect x="120" y="120" width="250" height="330" fill="url(#glass)"/>
  <rect x="390" y="120" width="250" height="330" fill="url(#glass)"/>
  <rect x="660" y="120" width="250" height="330" fill="url(#glass)"/>
  <rect x="930" y="120" width="250" height="330" fill="url(#glass)"/>
  <rect x="1200" y="120" width="250" height="330" fill="url(#glass)"/>
  <g fill="#3a3a46">
    <rect x="370" y="120" width="20" height="330"/><rect x="640" y="120" width="20" height="330"/>
    <rect x="910" y="120" width="20" height="330"/><rect x="1180" y="120" width="20" height="330"/>
  </g>
</g>

<!-- פסי תאורה בתקרה -->
<g>

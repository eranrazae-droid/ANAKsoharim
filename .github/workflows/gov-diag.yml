# בדיקת גישה למרשם הרכב: רצה ידנית או בדחיפה של הקובץ הזה, ומדפיסה
# ללוג מה מחזירה כל חוליה בשרשרת — משם אפשר לאבחן תקלות במשיכת נתונים.
name: Gov Registry Diagnostics
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/gov-diag.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe registry + seed plate_cache
        run: |
          RES="053cea08-09bc-40ec-8f7a-156f0677aff3"
          FS='%7B%22mispar_rechev%22%3A%2261257402%22%7D'
          echo "===== 1. כמה רשומות יש במאגר הממשלתי עכשיו? ====="
          curl -sS -m 60 "https://europe-west1-anak-soharim.cloudfunctions.net/govilProxy?resource_id=$RES&limit=1&include_total=true" \
            | python3 -c "import sys,json;d=json.load(sys.stdin).get('result',{});print('total:',d.get('total'),'| records:',len(d.get('records',[])))"
          echo "===== 2. משיכת רכב 61257402 + דגל registryEmpty ====="
          curl -sS -m 60 "https://europe-west1-anak-soharim.cloudfunctions.net/govilProxy?resource_id=$RES&filters=$FS&limit=1" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result',{}).get('records',[]);print('records:',len(r),'| registryEmpty:',d.get('registryEmpty'),'| first:',{k:r[0].get(k) for k in ('mispar_rechev','tozeret_nm','kinuy_mishari')} if r else '—')"
          echo "===== 3. הפעלת סריקת בעלויות — מזינה את plate_cache לכל המלאי ====="
          curl -sS -m 560 -w "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://europe-west1-anak-soharim.cloudfunctions.net/runOwnershipScanNow" | head -c 1200 || true
          echo; echo "===== 4. משיכה חוזרת של 61257402 אחרי הסריקה ====="
          curl -sS -m 60 "https://europe-west1-anak-soharim.cloudfunctions.net/govilProxy?resource_id=$RES&filters=$FS&limit=1" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result',{}).get('records',[]);print('records:',len(r),'| registryEmpty:',d.get('registryEmpty'))"

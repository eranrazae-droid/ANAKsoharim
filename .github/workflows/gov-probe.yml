name: Gov Probe

# בדיקה חד-פעמית: האם המאגר הממשלתי נגיש, ובאיזו דרך
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gov-probe.mjs'
      - '.github/workflows/gov-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gov-probe.mjs

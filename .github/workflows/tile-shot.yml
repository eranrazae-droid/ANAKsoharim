name: Tile Shot

# מוריד את אריחי המפה של אזור קרית אריה ומצרף אותם לתמונה אחת שנשמרת
# בענף — כדי לראות בדיוק מה מצויר על המפה. כלי אבחון זמני.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tile-shot.yml'

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-archimedes-nlfl58
      - name: Download and stitch tiles
        run: |
          # z16 סביב קרית אריה: lon 34.860 lat 32.100
          python3 - <<'EOF'
          import math, urllib.request, os
          lat, lon, z = 32.100, 34.860, 16
          n = 2 ** z
          xt = int((lon + 180) / 360 * n)
          yt = int((1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * n)
          os.makedirs('debug', exist_ok=True)
          for dy in range(-1, 2):
            for dx in range(-1, 2):
              url = f'https://tile.openstreetmap.org/{z}/{xt+dx}/{yt+dy}.png'
              req = urllib.request.Request(url, headers={'User-Agent': 'anak-ops-tile-check/1.0'})
              open(f'debug/t_{dy+1}_{dx+1}.png', 'wb').write(urllib.request.urlopen(req).read())
          EOF
          sudo apt-get install -y -q imagemagick > /dev/null 2>&1 || true
          montage debug/t_0_0.png debug/t_0_1.png debug/t_0_2.png \
                  debug/t_1_0.png debug/t_1_1.png debug/t_1_2.png \
                  debug/t_2_0.png debug/t_2_1.png debug/t_2_2.png \
                  -tile 3x3 -geometry +0+0 debug/kiryat-arye.png
          rm debug/t_*.png
      - name: Commit
        run: |
          git config user.name "tile-bot"
          git config user.email "actions@github.com"
          git add debug/kiryat-arye.png
          git commit -m "אבחון: צילום אריחי המפה של קרית אריה"
          git push

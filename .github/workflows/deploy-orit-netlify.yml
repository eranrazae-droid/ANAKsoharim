name: Deploy Orit to Netlify

on:
  push:
    branches:
      - claude/friendly-feynman-JZiSJ
    paths:
      - 'orit/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=orit --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 799e0d7e-fc58-478a-b92d-ce212e3d5c3c

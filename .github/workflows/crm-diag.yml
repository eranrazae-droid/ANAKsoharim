# בדיקת החיבור ל-CRM: רצה ידנית מלשונית Actions ומדפיסה ללוג את מצב
# החיבור ואת ההשוואה בין מלאי ה-CRM לפיד הישן. אין כאן מפתח — הוא
# יושב ב-Firestore, והפונקציה בשרת היא שמשתמשת בו.
name: CRM Diagnostics
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/crm-diag.yml', '.audit/crm-report.py']
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      B: https://europe-west1-anak-soharim.cloudfunctions.net
    steps:
      - uses: actions/checkout@v4
      - name: רכב בודד בזמן אמת
        run: |
          echo "===== 1. רכב 24555403 ====="
          curl -sS -m 60 "$B/crmVehicle?plate=24555403" | python3 .audit/crm-report.py vehicle
          echo
          echo "===== 2. מספר שאינו קיים ====="
          curl -sS -m 60 "$B/crmVehicle?plate=99999999"; echo
          echo "===== 3. מספר לא תקין ====="
          curl -sS -m 60 "$B/crmVehicle?plate=abc"; echo
      - name: מה הסריקות רואות אחרי החלפת המקור
        run: |
          echo "===== 0. המקור שממנו הסריקות מושכות =====" 
          curl -sS -m 120 "$B/inventoryCheck" | python3 .audit/crm-report.py source
          echo
      - name: פונקציות ההתראות עונות
        run: |
          echo "===== P1. המפתח הציבורי (חייב להיות נגיש בלי הזדהות) ====="
          curl -sS -m 60 -w " [HTTP %{http_code}]\n" "$B/pushKey" | head -c 300
          echo
          echo "===== P2. רישום בלי הזדהות — חייב להידחות ב-401 ====="
          curl -sS -m 60 -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            -H 'Content-Type: application/json' -d '{}' "$B/pushSubscribe"
          echo "===== P3. שליחה בלי הזדהות — חייב להידחות ב-401 ====="
          curl -sS -m 60 -o /dev/null -w "HTTP %{http_code}\n" -X POST \
            -H 'Content-Type: application/json' -d '{}' "$B/pushSend"
          echo
      - name: האם המרשם הממשלתי עצמו ריק
        run: |
          R="053cea08-09bc-40ec-8f7a-156f0677aff3"
          echo "===== A. כמה רשומות יש במרשם בכלל? ====="
          curl -sS -m 60 "$B/govilProxy?resource_id=$R&limit=1&include_total=true" | head -c 400
          echo; echo
          echo "===== B. רכבים ספציפיים — שניים שעבדו אתמול ואחד חדש ====="
          for P in 61257402 20044903 54853103 24555403; do
            F=$(python3 -c "import urllib.parse,json;print(urllib.parse.quote(json.dumps({'mispar_rechev':[int('$P')]})))")
            echo -n "  $P -> "
            curl -sS -m 60 "$B/govilProxy?resource_id=$R&filters=$F&limit=1" | head -c 260
            echo
          done
          echo
      - name: הרצת בדיקת הבעלויות ומה היא מחזירה
        run: |
          echo "===== 5. בדיקת בעלויות =====" 
          curl -sS -m 560 "$B/runOwnershipScanNow" | python3 .audit/crm-report.py ownscan
          echo
      - name: השוואת מלאי CRM מול הפיד הישן
        run: |
          echo "===== 4. מי נמצא באחד ולא בשני ====="
          curl -sS -m 180 "$B/crmCompare" | python3 .audit/crm-report.py compare

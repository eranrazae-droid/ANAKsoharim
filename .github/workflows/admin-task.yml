# פעולות תחזוקה חד־פעמיות. הקובץ נשאר במצב קריאה בלבד: כל ריצה מדווחת
# מצב ואינה משנה נתונים. כדי להריץ פעולה אמיתית מוסיפים אותה כאן במפורש.
#
# הפעולות הזמינות בשרת:
#   moveIntakePhotos?dry=1&col=intake_archive   ספירה בלבד
#   moveIntakePhotos?col=intake_archive         העברה בפועל
#   moveIntakePhotos?undo=1&col=intake_archive  החזרת התמונות למסמך המקורי
#   dbSizes                                     נפח כל האוספים
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: דיווח מצב בלבד
        run: |
          F="https://europe-west1-anak-soharim.cloudfunctions.net"
          curl -sS -m 540 "$F/dbSizes" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('סה\"כ:',d['totalMb'],'MB');[print(f\"{c['col']:<22}{c.get('docs','-'):>6}{c.get('mb','-'):>9} MB\") for c in d['collections'] if c.get('mb')]"

# פעולות תחזוקה חד־פעמיות שרצות מול השרת. מופעל בדחיפה של הקובץ הזה.
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # ריצה חוזרת אחרי שהפונקציה נפרסה
      - name: מדידת נפח האוספים
        run: |
          curl -sS -m 540 "https://europe-west1-anak-soharim.cloudfunctions.net/dbSizes" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('סה\"כ:',d['totalMb'],'MB');print(f\"{'אוסף':<24}{'מסמכים':>9}{'MB':>9}{'הכבד ביותר KB':>16}\");[print(f\"{c['col']:<24}{c.get('docs','-'):>9}{c.get('mb','-'):>9}{c.get('biggestKb','-'):>16}\") for c in d['collections']]"

# פעולות תחזוקה חד־פעמיות שרצות מול השרת. מופעל בדחיפה של הקובץ הזה.
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: ספירה בלבד - כמה תמונות יעברו ואיזה נפח
        run: |
          curl -sS -m 540 "https://europe-west1-anak-soharim.cloudfunctions.net/moveIntakePhotos?dry=1&col=intake_archive" \
            | python3 -m json.tool

# פעולות תחזוקה חד־פעמיות. קריאה בלבד אלא אם נוספה פעולה במפורש.
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: פירוט הנפח לפי שדה
        run: |
          curl -sS -m 540 "https://europe-west1-anak-soharim.cloudfunctions.net/dbSizes?fields=1&only=bodyshop_jobs,pickup_archive,pickup_cars,intake_archive" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(f\"{c['col']} — {c.get('docs')} מסמכים, {c.get('mb')}MB, הכבד ביותר {c.get('biggestKb')}KB\n   \"+'\n   '.join(c.get('fields',[]))+'\n') for c in d['collections']]"

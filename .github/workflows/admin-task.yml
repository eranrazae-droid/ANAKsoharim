# פעולות תחזוקה חד־פעמיות שרצות מול השרת. מופעל בדחיפה של הקובץ הזה.
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: השלמת ordered על הרכבות מצברים
        run: |
          B="https://europe-west1-anak-soharim.cloudfunctions.net/backfillBatteryOrdered"
          echo "===== ספירה בלבד (בלי לכתוב כלום) ====="
          curl -sS -m 540 "$B?dry=1" | python3 -m json.tool

# פעולות תחזוקה חד־פעמיות. אחרי הרצה מחזירים את הקובץ למצב קריאה בלבד.
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: העברת תמונות הקליטות הפעילות
        run: |
          F="https://europe-west1-anak-soharim.cloudfunctions.net"
          echo "===== ספירה ====="
          curl -sS -m 540 "$F/moveIntakePhotos?dry=1&col=intake_assignments" | python3 -m json.tool
          echo "===== ההעברה ====="
          curl -sS -m 540 "$F/moveIntakePhotos?col=intake_assignments" | python3 -m json.tool
          echo "===== אימות ====="
          curl -sS -m 540 "$F/moveIntakePhotos?dry=1&col=intake_assignments" | python3 -m json.tool
          echo "===== נפח אחרי ====="
          curl -sS -m 540 "$F/dbSizes" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('סה\"כ:',d['totalMb'],'MB');[print(f\"{c['col']:<22}{c.get('docs','-'):>6}{c.get('mb','-'):>9} MB\") for c in d['collections'] if c.get('mb')]"

# פעולות תחזוקה חד־פעמיות. הקובץ נשאר במצב קריאה בלבד: ריצה רגילה רק
# מדווחת מצב ואינה משנה נתונים. להרצת פעולה מוסיפים אותה כאן במפורש.
#
#   moveIntakePhotos?dry=1&col=<אוסף>   ספירה בלבד
#   moveIntakePhotos?col=<אוסף>         העברה בפועל
#   moveIntakePhotos?undo=1&col=<אוסף>  החזרת התמונות למסמך המקורי
#   dbSizes[?only=a,b]                  נפח האוספים
name: Admin Task
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/admin-task.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: דיווח מצב בלבד
        run: |
          curl -sS -m 540 "https://europe-west1-anak-soharim.cloudfunctions.net/dbSizes?only=intake_archive,intake_assignments,intake_photos,bodyshop_jobs,pickup_archive,wash_notes,wash_vehicles" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('סה\"כ:',d['totalMb'],'MB');[print(f\"{c['col']:<22}{c.get('docs','-'):>6}{c.get('mb','-'):>9} MB\") for c in d['collections']]"
